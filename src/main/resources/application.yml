spring:
  config:
    import: optional:classpath:application-local.yml,optional:file:./application-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_tracker
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: your-very-long-secret-key-minimum-32-characters-long
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

#900000 ms ÷ 1000 = 900 seconds
#900 seconds ÷ 60 = 15 minutes

#604800000 ms ÷ 1000 = 604800 seconds
#604800 seconds ÷ 60 ÷ 60 ÷ 24 = 7 days

file:
  upload-dir: ./uploads
